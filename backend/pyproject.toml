[project]
name = "quant-strategy-backend"
version = "0.1.0"
description = "Strategy Workbench backend and deterministic Python/Rust backtest engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "ruamel-yaml>=0.19.1",
    # 키움 모의 TLS(OS 신뢰 저장소)와 장중 체결 웹소켓. 둘 다 전이로만 들어와 있던 것을 직접 선언한다
    # (2026-10-22 리뷰 #594·#605). 판은 잠금 파일에 이미 있던 것이다.
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
server = "strategy_workbench.bootstrap.facade.server:main"

[project.optional-dependencies]
parquet = [
    "pyarrow>=15",
]
equity = [
    "duckdb>=1.5",
    "requests>=2.32",
]
llm = [
    "anthropic>=1.0",
    "openai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pyarrow>=25.0.1",
    "maturin>=1.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_engine", "src/strategy_workbench"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
# `tools`는 골든·스키마 재생성 스크립트다. 검사 범위를 넓히는 쪽이라 룰 완화가 아니다
# (C-01 감사 NB-6).
include = ["src", "tests", "examples", "scripts", "tools"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
