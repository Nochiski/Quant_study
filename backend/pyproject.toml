[project]
name = "quant-strategy-backend"
version = "0.1.0"
description = "Strategy Workbench backend and deterministic Python/Rust backtest engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=1.26",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pyarrow>=25.0.1",
    "maturin>=1.15.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_engine", "src/strategy_workbench"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests", "examples", "scripts"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
