name: ci

# 같은 커밋이 push·PR 두 번 돌지 않게 push는 main만 본다. 브랜치 작업은 PR 실행이 검사한다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 PR에 새 커밋이 오면 앞 실행은 결과를 볼 일이 없으니 취소한다. main은 커밋마다 끝까지 돈다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job 마다 제한 시간을 둔다(#599 리뷰 P3-3). 배정 루프의 라이브락 같은 회귀가 들어오면 GitHub 기본값
  # 360분 동안 멈춘다. 값은 최근 main 실행 시간의 약 3배다(backend 15~25분, frontend 약 5분, 나머지 2분 안).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # backend 시간의 대부분이 maturin release 빌드다. 의존 크레이트 빌드 산출물을 재사용한다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust/backtest_core
      - run: uv sync --locked --extra parquet --extra equity --extra llm
      - run: uv run maturin develop --manifest-path rust/backtest_core/Cargo.toml --release
      - run: uv run pytest -q
      - name: Equity layer tests
        working-directory: .
        run: uv run --project backend pytest database/tests -q
      # 대응표(EQUITY_FIELD_MAP §2)가 레지스트리(backend/FACTORS.md) 요구 필드를 전부 덮는지 본다.
      # #218 이 레지스트리를 바꾸고 대응표를 두고 가 이 검사가 CI 밖에서 조용히 rc=1 이었다(문서 감사 결정 5).
      - name: Equity field map covers the factor registry
        working-directory: .
        run: uv run --project backend python database/scripts/check_field_map.py
      - name: Verify root server contract
        working-directory: .
        run: |
          uv lock --check
          uv run --locked python -m unittest discover -s tools/tests -p 'test_*.py'
          uv run --project backend ruff check tools
          uv run --project backend pyright tools
      # 해소되지 않은 병합 충돌 표식은 파일을 정상으로 읽히게 두면서 옛 행을 되살린다 —
      # P1-02 rebase에서 SoT 대장 5행이 두 벌이 된 사고(Phase 1 감사)의 재발 방지다.
      - name: No committed merge conflict markers
        working-directory: .
        run: uv run --locked python -m quant_study_dev.conflict_markers
      # `tools`는 `backend/tools/`다. 위 "Verify root server contract" step의 `tools`와
      # 다르다 — 그쪽은 working-directory가 `.`라 저장소 루트를 가리킨다. 골든 재생성
      # 도구가 lint·타입 검사 없이 머지되면, 도구가 깨져도 골든 테스트는 초록이고
      # "재생성 명령이 안 돈다"로만 드러난다(C-01 감사 NB-6).
      - run: uv run ruff check src tests examples scripts tools
      - run: uv run pyright
      - run: cargo fmt --manifest-path rust/backtest_core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/backtest_core/Cargo.toml --all-targets -- -D warnings
      # PyO3's extension-module feature deliberately skips libpython linking on Unix. Rust test
      # binaries need that link, so exercise the same code without the packaging-only feature.
      - run: cargo test --manifest-path rust/backtest_core/Cargo.toml --no-default-features
      # 공급자 SDK는 optional extra `llm`이다. 설치되지 않은 환경이 정상이고(spec D4의 "설치 필요"
      # 상태가 성립하려면 그래야 한다), 그 환경에서 어시스턴트 계약 스위트가 **수집되고 통과해야**
      # 한다. extra 하나가 빠졌다고 SSE 순서·재개·409·비밀 누설 테스트가 통째로 사라지면 안 된다.
      # 따로 있던 `backend-no-extras` job을 합쳐 맨 끝에 둔다. `uv sync`는 정확 동기화라 extra와
      # maturin이 깐 확장을 함께 지우므로 확장을 다시 깐다(위 빌드의 target을 재사용한다).
      # A-07이 더한 네 파일도 여기 있어야 한다. 넷 다 SDK를 직접 import하지 않지만, 나중에 누가 그
      # 의존을 들이면 이 step이 잡는 것이 이 step의 존재 이유다(C-01 감사 NB-7).
      - name: Assistant contract tests without extras
        run: |
          uv sync --locked
          uv run maturin develop --manifest-path rust/backtest_core/Cargo.toml --release
          uv run pytest -q \
            tests/integration/test_assistant_http_api.py \
            tests/test_bootstrap_assistant.py \
            tests/test_assistant_live_smoke.py \
            tests/application/test_assistant_prompt_fixtures.py \
            tests/application/test_assistant_scenarios.py \
            tests/application/test_assistant_usage.py \
            tests/architecture

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project ../backend --locked
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- ../backend/openapi.json src/shared/api/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser-e2e:
    # Baselines use bundled exact-version webfonts; pin the Windows generation as well so the
    # host rasterizer does not silently move from one runner generation to another.
    runs-on: windows-2025
    # Windows 설치·빌드, run worker 테스트, 누적된 전체 브라우저 회귀를 함께 포함하는 job 예산이다.
    # 20분 전체 제한에 의한 중단을 막고, 개별 test·expect·poll의 대기와 단언은 유지한다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust/backtest_core
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: uv run --project backend maturin develop --manifest-path backend/rust/backtest_core/Cargo.toml --release
      # run worker 프로세스는 Windows 에서 프로세스 그룹·파이프·인코딩 경로가 Linux 와 다르다(run-worker
      # spec 8절). 따로 있던 `backend-windows-worker` job을 같은 Windows 셋업을 쓰는 이 job에 합쳤다.
      - name: Windows run worker tests
        working-directory: backend
        run: >
          uv run pytest -q
          tests/integration/test_run_worker_process.py
          tests/integration/test_run_worker_spare.py
          tests/integration/test_run_worker_termination.py
          tests/test_run_worker_protocol.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      # 유저 스토리 하네스(`docs/product/user-stories/`): 스토리 상태·e2e 태그·traceability 표 정적 검사에
      # 더해, 스토리 태그가 붙은 e2e가 이 게이트에서 실제로 수집되고 건너뛰지 않는지 본다. 정적 검사는
      # project의 testMatch를 모르므로 Playwright가 만든 목록과 맞춘다. 정적 검사만 돌던 별도 job은
      # 이 step이 같은 검사를 포함해 합쳤다. 검사기 단위 테스트는 backend job "Verify root server contract".
      - name: 유저 스토리 e2e가 릴리스 게이트에 드는지 확인
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/story-list.json
        run: |
          node frontend/e2e/run-playwright.mjs --list --reporter=json
          uv run --locked python -m quant_study_dev.user_story_trace --playwright-list "$PLAYWRIGHT_JSON_OUTPUT_NAME"
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-e2e-${{ runner.os }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      # 전체 trace 묶음은 커질 수 있어 렌더 검토에 필요한 이미지·문맥도 실패 시 별도 보관한다.
      - name: Upload browser visual review artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-review-${{ runner.os }}
          path: |
            frontend/test-results/**/*-actual.png
            frontend/test-results/**/*-diff.png
            frontend/test-results/**/test-failed-*.png
            frontend/test-results/**/attachments/*.json
            frontend/test-results/**/attachments/*.png
            frontend/playwright-report/data/*.png
            frontend/playwright-report/index.html
            frontend/test-results/**/graph-selected.png
            frontend/test-results/**/recipe-*.png
            frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
