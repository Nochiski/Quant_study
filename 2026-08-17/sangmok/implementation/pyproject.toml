[project]
name = "quant-study-sangmok"
version = "0.1.0"
description = "Personal Zipline Reloaded backtesting tutorial using PyKRX data."
requires-python = ">=3.11,<3.12"
dependencies = [
    "exchange-calendars>=4.5",
    "fastapi>=0.116",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pykrx>=1.0.48",
    "uvicorn>=0.35",
    "zipline-reloaded>=3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
