[project]
name = "technical-analysis"
version = "0.1.0"
description = "기술적 지표 계산 모듈과 종목 조회 도구(동민 개인 실습 폴더)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "duckdb>=1.0",
    # 자동 채널 점수(후보 수백 개 × 무작위 이동)를 몇 초 안에 내려면 필요하다
    "numba>=0.59",
]

[project.scripts]
ta = "technical_analysis.tool.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technical_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
