# scope_v1.0 — 메인 모델. 원본 v3 5팩터 z-score(`v3_zscore.toml`)를 그대로 쓰고 밸류의 EV/EBITDA 만 뺐다
# (2026-10-02 사용자 결정). 사람이 부르는 이름은 `scope_v1.0`, 레지스트리 id 는 `scope@1.0`.
#
# EV/EBITDA 를 뺀 이유: 원본 v3 는 설정에 ev_ebitda .25 가 있지만 데이터가 3/1,321 종목뿐이라 실제로는
# PER·PBR·배당만으로 밸류를 계산했다. 이식판은 WISE cF4002 로 538/587 종목에 값이 있어 원본과 순위가
# 갈렸다(10-01 추정치 보유 585 대조: 밸류 순위상관 0.987 → 시뮬레이션 0.997). 엔진은 있는 하위 지표끼리
# 비례 재정규화하므로, 키를 빼면 원본에서 EV/EBITDA 가 비었을 때와 같은 계산이 된다.
#
# 유니버스는 3개월 의견 기준 하나를 더한다(2026-10-05 사용자 결정, 첫 발송 전이라 v1.0 에 포함):
# 추정기관수(WISE 최근 3개월 투자의견을 낸 증권사 수)가 0 이면 제외 — 추정치는 있어도 최근 의견이
# 없는 종목이다(10-01: 587 중 77). 기관수를 모르는(NULL) 종목은 빼지 않는다. 1~3명은 남기고 엑셀
# 비고에 표시한다.
#
# 퀄리티에는 짧은 첫 사업연도 규칙(min_period_months, 아래 — 2026-10-07 N-25 Q5)을 더한다.
# 나머지는 `v3_zscore.toml` 과 글자 그대로 같다(테스트가 대조한다). `v3_zscore@1.0` 은 원본 코드 동등성
# 검증(골든·G-M3) 기준으로 남는다. 키 순서가 합산 순서다.

model_id = "scope"
version = "1.0"
engine = "v3_zscore"

[buckets]
momentum = 0.30
revision = 0.30
flow = 0.20
quality = 0.10
valuation = 0.10

[universe]
require_estimates = true
sec_types = ["common", "spac"]
markets = ["KOSPI", "KOSDAQ"]
min_market_cap = 1000.0
min_analysts = 1

[params.momentum.sub_weights]
r1m = 0.35
r3m = 0.25
r6m = 0.20
r9m = 0.12
r12m = 0.08

[params.revision.metrics]
operating_profit = 0.4
net_income = 0.6

[params.revision.periods]
"1w" = 0.25
"1m" = 0.45
"3m" = 0.30

[params.flow.sub_weights]
inst_5d = 0.25
inst_20d = 0.15
for_5d = 0.25
for_20d = 0.15
pe_5d = 0.10
pe_20d = 0.10

# 짧은 첫 사업연도(G-28, 2026-10-07 사용자 결정 N-25 Q5 — 이름은 scope_v1.0 유지): 연간 행 기간
# (fi_fin_summary.period_months, 달력 달 수)이 12개월 미만이면 그 기를 퀄리티 손익 지표(gpa·roa·
# fcf_assets·gpa_change)에서 뺀다. 부채비율·변동성은 그대로, 기간을 모르면(NULL) 빼지 않는다.
# 결산월 변경·리츠 단기 결산도 걸린다 — 엑셀 비고는 후속(4-2a 병합 뒤)이고 문구는 '회계기간 N개월',
# 문턱은 12 를 박지 말고 이 값을 읽는다. v3_zscore.toml 에는 이 키가 없다(원본 대조용 — 끈 상태).
[params.quality]
min_period_months = 12

[params.quality.sub_weights]
gpa = 0.20
roa = 0.15
fcf_assets = 0.15
debt_ratio = 0.15
gpa_change = 0.15
std_20d = 0.20

# ev_ebitda(.25) 삭제 — 남은 셋은 원본 가중 그대로, 엔진이 .75 로 나눠 PER .40·PBR .40·배당 .20 이 된다
[params.valuation.sub_weights]
per = 0.30
pbr = 0.30
dividend_yield = 0.15
