# lang2 완료 정의 아이디어 5 — 변동성 역가중(spec 5절). 알파 팩터 하나(12-1 모멘텀)로 종목을 고르고,
# 변동성 팩터 하나(일간 수익률의 60 세션 표준편차)의 역수로 비중을 나눈다(risk_factor_id, P2-06).
# 변동성 팩터는 합성 점수에서 빠진다 — 그것 하나만 두면 알파가 0개라 compile 이 막는다.
schema_version: "1.2"
title: "변동성 역가중"
factors:
  - factor_id: momentum_12_1
    label: "12-1 모멘텀"
    direction: high
    graph:
      nodes:
        - kind: field
          node_id: close
          field_id: price.close
        - kind: time_series
          node_id: mom_12_1
          operator: momentum
          input_node_id: close
          window: 252
          lag: 21
      output_node_id: mom_12_1
  - factor_id: volatility_60
    label: "60일 변동성"
    direction: low
    graph:
      nodes:
        - kind: field
          node_id: close
          field_id: price.close
        - kind: time_series
          node_id: daily_return
          operator: momentum
          input_node_id: close
          window: 2
        - kind: time_series
          node_id: vol_60
          operator: std
          input_node_id: daily_return
          window: 60
      output_node_id: vol_60
portfolio:
  selection_count: 20
  weighting: risk
risk:
  max_name_weight: 0.1
  risk_factor_id: volatility_60
