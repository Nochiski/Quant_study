name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: uv sync --locked --extra parquet --extra equity
      - run: uv run maturin develop --manifest-path rust/backtest_core/Cargo.toml --release
      - run: uv run pytest -q
      - name: Verify root server contract
        working-directory: .
        run: |
          uv lock --check
          uv run --locked python -m unittest discover -s tools/tests -p 'test_*.py'
          uv run --project backend ruff check tools
          uv run --project backend pyright tools
      - run: uv run ruff check src tests examples scripts
      - run: uv run pyright
      - run: cargo fmt --manifest-path rust/backtest_core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/backtest_core/Cargo.toml --all-targets -- -D warnings
      # PyO3's extension-module feature deliberately skips libpython linking on Unix. Rust test
      # binaries need that link, so exercise the same code without the packaging-only feature.
      - run: cargo test --manifest-path rust/backtest_core/Cargo.toml --no-default-features

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project ../backend --locked
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- ../backend/openapi.json src/shared/api/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify root frontend contract
        working-directory: .
        shell: bash
        run: |
          npm ci
          setsid npm run dev -- --host 127.0.0.1 --port 41730 --strictPort > "$RUNNER_TEMP/root-vite.log" 2>&1 &
          dev_pid=$!
          trap 'kill -INT -- -"$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:41730/ | grep --fixed-strings --quiet '<div id="root"></div>'; then
              exit 0
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/root-vite.log"
          exit 1
