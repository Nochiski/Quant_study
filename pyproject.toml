[project]
name = "backtest-engine"
version = "0.1.0"
description = "이벤트 드리븐 백테스트 엔진 — 설계 아티팩트의 전략 I/O 계약을 구현하는 Python reference engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_engine"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["2026-08-17"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests", "examples"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
