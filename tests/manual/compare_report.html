<script>
const data = JSON.parse(document.getElementById("payload").textContent);
// 시나리오 쌍은 같은 색 계열: engine=가는 실선, zipline=굵은 반투명 (겹치면 한 선처럼 보임)
const HUES = ["#0f766e", "#b45309", "#7c3aed", "#be123c"];

const paramsTable = document.getElementById("params");
for (const [key, value] of Object.entries(data.params)) {
  const row = paramsTable.insertRow();
  row.insertCell().textContent = key;
  row.insertCell().textContent = String(value);
}

const stats = document.getElementById("stats");
stats.insertAdjacentHTML("beforeend",
  "<tr><th>시나리오</th><th>판정</th><th>공통 세션</th><th>한쪽에만</th>" +
  "<th>max rel diff</th><th>mean rel diff</th><th>허용치</th><th>초과 세션</th></tr>");
data.scenarios.forEach((s, i) => {
  const badge = s.ok ? '<span class="badge ok">OK</span>'
                     : '<span class="badge bad">MISMATCH</span>';
  stats.insertAdjacentHTML("beforeend",
    `<tr><td style="color:${HUES[i % HUES.length]};font-weight:700">${s.scenario}</td>` +
    `<td>${badge}</td><td>${s.matched_sessions}</td>` +
    `<td>engine ${s.left_only_sessions} / zipline ${s.right_only_sessions}</td>` +
    `<td>${s.max_rel_diff.toExponential(2)} (${s.max_diff_session ?? "-"})</td>` +
    `<td>${s.mean_rel_diff.toExponential(2)}</td>` +
    `<td>${s.rel_tol.toExponential(0)}</td><td>${s.breach_count}</td></tr>`);
});

function svgLine(series, x0, x1, y0, y1, width, height, pad) {
  const sx = v => pad + (v - x0) / Math.max(x1 - x0, 1) * (width - 2 * pad);
  const sy = v => height - pad - (v - y0) / Math.max(y1 - y0, 1e-12) * (height - 2 * pad);
  return series
    .map(([x, y], i) => (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(y).toFixed(1))
    .join(" ");
}

function drawChart(container, seriesList, formatY) {
  const width = 1040, height = 300, pad = 46;
  const xs = seriesList.flatMap(s => s.points.map(p => p[0]));
  const ys = seriesList.flatMap(s => s.points.map(p => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const fmtDate = ms => new Date(ms).toISOString().slice(0, 10);
  let svg = `<svg class="chart" width="${width}" height="${height}" role="img">`;
  svg += `<text x="${pad}" y="${height - pad + 16}" font-size="11">${fmtDate(x0)}</text>`;
  svg += `<text x="${width - pad}" y="${height - pad + 16}" font-size="11"
    text-anchor="end">${fmtDate(x1)}</text>`;
  svg += `<text x="4" y="${height - pad}" font-size="11">${formatY(y0)}</text>`;
  svg += `<text x="4" y="${pad}" font-size="11">${formatY(y1)}</text>`;
  for (const s of seriesList) {
    const path = svgLine(s.points, x0, x1, y0, y1, width, height, pad);
    svg += `<path d="${path}" fill="none" stroke="${s.color}"
      stroke-width="${s.widthPx}" stroke-opacity="${s.opacity}"/>`;
  }
  svg += "</svg>";
  container.insertAdjacentHTML("beforeend", svg);
}

const toXY = curve => curve.map(([d, v]) => [Date.parse(d), v]);
const equitySeries = [], diffSeries = [], equityLegend = [], diffLegend = [];
data.scenarios.forEach((s, i) => {
  const hue = HUES[i % HUES.length];
  equitySeries.push({ points: toXY(s.zipline_curve), color: hue, widthPx: 4.2, opacity: 0.3 });
  equitySeries.push({ points: toXY(s.engine_curve), color: hue, widthPx: 1.3, opacity: 1.0 });
  const ziplineByDate = new Map(s.zipline_curve.map(([d, v]) => [d, v]));
  const relDiff = s.engine_curve
    .filter(([d]) => ziplineByDate.has(d))
    .map(([d, v]) => {
      const z = ziplineByDate.get(d);
      return [Date.parse(d), Math.abs(v - z) / Math.max(Math.abs(z), 1)];
    });
  diffSeries.push({ points: relDiff, color: hue, widthPx: 1.2, opacity: 1.0 });
  const swatch = `<span style="color:${hue}">■</span>`;
  equityLegend.push(`${swatch} ${s.scenario} (가는 실선=engine, 굵은 반투명=zipline)`);
  diffLegend.push(`${swatch} ${s.scenario}`);
});
drawChart(document.getElementById("equity"), equitySeries,
  v => Math.round(v).toLocaleString());
drawChart(document.getElementById("diff"), diffSeries, v => v.toExponential(1));
document.getElementById("equity-legend").innerHTML = equityLegend.join(" · ");
document.getElementById("diff-legend").innerHTML = diffLegend.join(" · ");
</script>
