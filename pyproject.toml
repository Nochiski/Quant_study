[project]
name = "quant-study-dev"
version = "0.1.0"
description = "Repository-level development command delegates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
server = "quant_study_dev.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/quant_study_dev"]

[tool.uv]
package = true
